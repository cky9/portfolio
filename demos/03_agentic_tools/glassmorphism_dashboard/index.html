<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业级全景数字化态势看板 (Glassmorphism Dashboard)</title>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-green: #2ea043;
            --accent-blue: #58a6ff;
            --accent-purple: #bc8cff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(88, 166, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(188, 140, 255, 0.08) 0%, transparent 40%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: rgba(46, 160, 67, 0.2);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(46, 160, 67, 0.3);
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-sub {
            font-size: 12px;
            margin-top: 6px;
            color: var(--accent-green);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ 工业工程与企业数字化敏捷控制台</h1>
        <div class="badge">● 系统稳定运行 128 小时</div>
    </div>

    <!-- KPI 核心指标卡 -->
    <div class="kpi-grid">
        <div class="card">
            <div class="card-title">IE 平均工时提效 (SMV)</div>
            <div class="card-value">-18.4%</div>
            <div class="card-sub">↑ 动作浪费大幅削减</div>
        </div>
        <div class="card">
            <div class="card-title">BOM 脏物料自动归一率</div>
            <div class="card-value">99.2%</div>
            <div class="card-sub">↑ 毫秒级编辑距离对齐</div>
        </div>
        <div class="card">
            <div class="card-title">RPA 本地数据清洗吞吐</div>
            <div class="card-value">15.2k/s</div>
            <div class="card-sub">● 0 外部 Token 费用</div>
        </div>
        <div class="card">
            <div class="card-title">状态机熔断与异常拦截</div>
            <div class="card-value">0 脏读</div>
            <div class="card-sub">● 金融级幂等性保障</div>
        </div>
    </div>

    <!-- 图表展示区 -->
    <div class="charts-grid">
        <div class="card">
            <div class="card-title">车间装配工序动作耗时分布 (秒/循环)</div>
            <div class="chart-container">
                <canvas id="barChart"></canvas>
            </div>
        </div>
        <div class="card">
            <div class="card-title">数字化系统综合能力雷达评估</div>
            <div class="chart-container">
                <canvas id="radarChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 柱状图
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['抓取物料', '对齐插接', '紧固螺钉', '目视自检', '贴标装箱'],
                datasets: [{
                    label: '优化前工时 (s)',
                    data: [2.8, 4.5, 3.2, 2.0, 3.8],
                    backgroundColor: 'rgba(139, 148, 158, 0.4)',
                    borderColor: 'rgba(139, 148, 158, 0.8)',
                    borderWidth: 1
                }, {
                    label: '优化后工时 (s)',
                    data: [1.8, 3.2, 2.1, 1.4, 2.6],
                    backgroundColor: 'rgba(46, 160, 67, 0.6)',
                    borderColor: 'rgba(46, 160, 67, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#8b949e' } },
                    x: { grid: { display: false }, ticks: { color: '#8b949e' } }
                },
                plugins: { legend: { labels: { color: '#f0f6fc' } } }
            }
        });

        // 雷达图
        const ctxRadar = document.getElementById('radarChart').getContext('2d');
        new Chart(ctxRadar, {
            type: 'radar',
            data: {
                labels: ['工时节拍', '数据清洗', '系统容灾', '0预算平替', 'RPA穿透', '智能体协同'],
                datasets: [{
                    label: '系统实测指标',
                    data: [92, 98, 96, 95, 90, 88],
                    backgroundColor: 'rgba(88, 166, 255, 0.25)',
                    borderColor: '#58a6ff',
                    pointBackgroundColor: '#bc8cff',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                        grid: { color: 'rgba(255, 255, 255, 0.08)' },
                        pointLabels: { color: '#8b949e', font: { size: 11 } },
                        ticks: { display: false, max: 100, min: 0 }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
